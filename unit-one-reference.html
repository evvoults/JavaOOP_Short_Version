      if((m=/^"(?:[^"\\\r\n]|\\["\\nrtbf])*"/.exec(rest))){let value;try{value=JSON.parse(m[0]);}catch{throw Error('Χρησιμοποίησε απλό κείμενο μέσα σε διπλά εισαγωγικά.');}tokens.push({kind:'string',value});p+=m[0].length;continue;}
      if((m=/^-?\d+(?:\.\d+)?(?:[dD])?/.exec(rest))){if(/^-?0\d/.test(m[0]))throw Error('Σε αυτή την άσκηση γράψε δεκαδικούς αριθμούς χωρίς επιπλέον αρχικά μηδενικά.');const value=Number(m[0].replace(/[dD]$/,''));if(!Number.isFinite(value))throw Error('Η αριθμητική τιμή είναι υπερβολικά μεγάλη.');tokens.push({kind:'number',value,raw:m[0]});p+=m[0].length;continue;}
      if((m=/^[A-Za-z_$][A-Za-z0-9_$]*/.exec(rest))){tokens.push({kind:'id',value:m[0]});p+=m[0].length;continue;}
      if('{}();=.'.includes(rest[0])){tokens.push({kind:'punct',value:rest[0]});p++;continue;}
      throw Error(`Δεν αναγνωρίζεται το σύμβολο «${rest[0]}». Έλεγξε τη σύνταξη και τα εισαγωγικά.`);
    }return tokens;
  }
  function parser(tokens){let at=0;return{peek:()=>tokens[at],done:()=>at===tokens.length,take(v){const t=tokens[at];if(!t||t.value!==v)throw Error(`Αναμενόταν «${v}»${t?' πριν από «'+t.value+'»':''}.`);at++;return t;},id(){const t=tokens[at];if(!t||t.kind!=='id'||forbidden.has(t.value))throw Error('Χρειάζεται έγκυρο όνομα πεδίου ή μεταβλητής.');at++;return t.value;},literal(){const t=tokens[at];if(!t||!['number','string'].includes(t.kind))throw Error('Δώσε αριθμό ή κείμενο μέσα σε διπλά εισαγωγικά.');at++;return t;}};}
  function checkEditor(n,classSource,mainSource){
    const d=domains[n],c=parser(lex(classSource)),fields=Object.create(null);
    c.take('class');c.take(n);c.take('{');
    while(c.peek()&&c.peek().value!=='}'){const t=c.peek().value;if(!['String','int','double'].includes(t))throw Error('Σε αυτό το παράδειγμα δήλωσε τα δύο πεδία με String, int ή double, χωρίς επιπλέον προσδιοριστές.');c.take(t);const f=c.id();if(Object.hasOwn(fields,f))throw Error(`Το πεδίο ${f} έχει δηλωθεί δύο φορές.`);c.take(';');fields[f]=t;}
    c.take('}');if(!c.done())throw Error('Στο πρώτο πλαίσιο γράψε μόνο τον ορισμό της ζητούμενης κλάσης.');
    if(Object.keys(fields).length!==2||d.fields.some(f=>fields[f[0]]!==f[1]))throw Error(`Η ${n} χρειάζεται ακριβώς τα πεδία ${d.fields.map(f=>f[1]+' '+f[0]).join(' και ')}.`);
    const p=parser(lex(mainSource)),objects=[],variables=Object.create(null);
    while(!p.done()){
      if(p.peek().value===n){p.take(n);const v=p.id();if(v===n||Object.hasOwn(variables,v))throw Error(`Χρησιμοποίησε διαφορετικό, πεζό όνομα για τη μεταβλητή ${v}.`);p.take('=');p.take('new');p.take(n);p.take('(');p.take(')');p.take(';');variables[v]=objects.length;objects.push({variable:v,values:Object.fromEntries(d.fields.map(f=>[f[0],f[1]==='String'?null:0])),assigned:new Set()});}
      else{const v=p.id();if(!Object.hasOwn(variables,v))throw Error(`Δημιούργησε πρώτα το αντικείμενο της μεταβλητής ${v} με new.`);p.take('.');const f=p.id();if(!Object.hasOwn(fields,f))throw Error(`Η κλάση ${n} δεν έχει πεδίο ${f}.`);p.take('=');const value=p.literal();p.take(';');const type=fields[f];if((type==='String'&&value.kind!=='string')||(type!=='String'&&value.kind!=='number')||(type==='int'&&!/^-?\d+$/.test(value.raw??'')))throw Error(`Το ${f} χρειάζεται ${type==='String'?'κείμενο σε διπλά εισαγωγικά':type==='int'?'ακέραιο αριθμό':'αριθμητική τιμή'}.`);if(type==='int'&&(value.value<-2147483648||value.value>2147483647))throw Error('Η τιμή πρέπει να χωρά στον τύπο int.');objects[variables[v]].values[f]=value.value;objects[variables[v]].assigned.add(f);}
    }
    if(objects.length!==2)throw Error('Χρειάζονται ακριβώς δύο δημιουργίες αντικειμένων με new.');
    if(objects.some(o=>d.fields.some(f=>!o.assigned.has(f[0]))))throw Error('Δώσε τιμή και στα δύο πεδία κάθε αντικειμένου.');
    if(d.fields.some(f=>objects[0].values[f[0]]===objects[1].values[f[0]]))throw Error('Για αυτή την αποστολή δώσε διαφορετική τιμή σε κάθε αντίστοιχο πεδίο των δύο αντικειμένων.');
    return objects.map(o=>d.fields.map(f=>o.values[f[0]]));
  }
  function go(step,example=0){stepIndex=step;exampleIndex=example;render();}
  root.addEventListener('input',e=>{const store=e.target.dataset.store;if(store){state()[store]=e.target.value;const full=q('#ou-full-program');if(full)full.textContent=fullProgram(state());persist();}});
  root.addEventListener('change',e=>{const store=e.target.dataset.store;if(store)state()[store]=e.target.value;});
  root.addEventListener('keydown',e=>{if(e.target.matches('textarea')&&e.key==='Tab'){/* Native tab order is preserved. */}if(e.key==='Enter'&&e.target.matches('input')){const k=cur().kind,actions={predict:'predict-check',codefill:'codefill-check',review:'review-check'};if(actions[k]){e.preventDefault();q(`[data-action="${actions[k]}"]`).click();}}});
  root.addEventListener('click',e=>{
    const nav=e.target.closest('[data-step]');if(nav){go(Number(nav.dataset.step));return;}
    const el=e.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action,st=state(),n=name(),d=domains[n];
    if(action==='intro-done')feedback(true,`Η ${n} είναι το κοινό πρότυπο. Τα δύο συγκεκριμένα παραδείγματα είναι αντικείμενά της, με δικές τους τιμές.`);
    if(action==='observe'){st.choice=Number(el.dataset.value);feedback(st.choice===0,st.choice===0?'Ίδια ονόματα πεδίων, διαφορετικές τιμές: δύο αντικείμενα της ίδιας κλάσης.':'Οι διαφορετικές τιμές δεν αλλάζουν την κλάση. Σύγκρινε τα ονόματα των πεδίων στα δύο αντικείμενα.');render();}
    if(action==='field-toggle'){const value=el.dataset.value;st.selected=st.selected.includes(value)?st.selected.filter(v=>v!==value):[...st.selected,value];st.feedback=null;render();}
    if(action==='fields-check'){const ok=st.selected.length===2&&d.fields.every(f=>st.selected.includes(f[0]));feedback(ok,ok?`Τα ${d.fields[0][0]} και ${d.fields[1][0]} είναι πεδία. Τα αντικείμενα έχουν τα ίδια πεδία, με διαφορετικές τιμές.`:'Επίλεξε τα ονόματα των δύο πεδίων. Ένα συγκεκριμένο κείμενο ή ένας αριθμός είναι τιμή, όχι όνομα πεδίου.');}
    if(action==='schema-check'){const ok=st.fieldOne===`${d.fields[0][1]} ${d.fields[0][0]};`&&st.fieldTwo===`${d.fields[1][1]} ${d.fields[1][0]};`;feedback(ok,ok?`Περιέγραψες τη δομή της ${n}. Κάθε αντικείμενό της θα έχει αυτά τα πεδία.`:'Εδώ ζητείται πρότυπο χωρίς αρχικές τιμές: διάλεξε τύπο και όνομα πεδίου, χωρίς το σύμβολο =.');}
    if(action==='sort-select'){st.active=el.dataset.value;st.feedback=null;render();}
    if(action==='sort-drop'){if(!st.active){feedback(false,'Επίλεξε πρώτα μια κάρτα και μετά την κατηγορία της.',false);return;}st.assignments[st.active]=el.dataset.value;st.active=null;st.feedback=null;render();}
    if(action==='sort-check'){const ok=st.assignments.template==='class'&&st.assignments.first==='object'&&st.assignments.second==='object';feedback(ok,ok?`Η ${n} είναι το πρότυπο. Οι δύο κάρτες με συγκεκριμένα στοιχεία είναι αντικείμενα της κλάσης.`:'Το γενικό πρότυπο μπαίνει στην «Κλάση». Κάθε κάρτα με συγκεκριμένες τιμές μπαίνει στο «Αντικείμενο». Μπορείς να μετακινήσεις ξανά τις κάρτες.');}
    if(action==='create'&&st.created<3){st.created++;if(st.created===3)feedback(true,'Δημιούργησες τρία αντικείμενα. Η κλάση παραμένει μία, επειδή το κοινό πρότυπο είναι το ίδιο.');render();}
    if(action==='predict-check'){st.prediction=q('#ou-prediction').value;if(st.prediction.trim()===''){feedback(false,'Γράψε πρώτα την πρόβλεψή σου.',false);return;}st.tried=true;const ok=Number(st.prediction)===d.objects[1][1];feedback(ok,ok?`Το δεύτερο αντικείμενο κρατά την τιμή ${d.objects[1][1]}. Αλλάξαμε μόνο το πρώτο από τα δύο ξεχωριστά αντικείμενα.`:`Το δεύτερο διατηρεί την τιμή ${d.objects[1][1]}. Τα αντικείμενα δημιουργήθηκαν χωριστά και το καθένα έχει δικές του τιμές.`);render();}
    if(action==='codefill-check'){st.newWord=q('#ou-new-word').value;const ok=st.newWord.trim()==='new';st.codeCreated=ok;feedback(ok,ok?`Η new δημιουργεί ένα νέο αντικείμενο ${n}. Η μεταβλητή item αναφέρεται σε αυτό.`:'Χρειάζεται η λέξη κλειδί new, με πεζά γράμματα. Η δήλωση μιας μεταβλητής μόνη της δεν δημιουργεί αντικείμενο.');render();}
    if(action==='hint'){st.hints=(st.hints??0)+1;feedback(null,st.hints===1?`Η κλάση αρχίζει με class ${n}. Κάθε πεδίο γράφεται ως τύπος όνομα; — π.χ. ${d.fields[0][1]} ${d.fields[0][0]};`:`Μέσα στη main: ${n} a = new ${n}(); Έπειτα δώσε τιμές με a.${d.fields[0][0]} = ${fmt(d.objects[0][0],d.fields[0][1])}; Επανάλαβε για το δεύτερο πεδίο και για νέο αντικείμενο b.`,false);}
    if(action==='run-real'){st.classText=q('#ou-class-code').value;st.mainText=q('#ou-main-code').value;window.parent.postMessage({type:'java-lab-run',title:n+' · Ο δικός σου κώδικας',code:fullProgram(st)},location.origin);}
    if(action==='editor-check'){st.classText=q('#ou-class-code').value;st.mainText=q('#ou-main-code').value;try{st.editorObjects=checkEditor(n,st.classText,st.mainText);feedback(true,'Ο ορισμός, οι δύο δημιουργίες και οι αναθέσεις συμφωνούν με την αποστολή. Η εικόνα δείχνει τις δικές σου τιμές.');}catch(err){st.editorObjects=null;feedback(false,err.message);}render();}
    if(action==='review-check'){st.classCount=q('#ou-class-count').value;st.objectCount=q('#ou-object-count').value;const ok=st.classCount.trim()!==''&&st.objectCount.trim()!==''&&Number(st.classCount)===1&&Number(st.objectCount)===3;feedback(ok,ok?'Ένας ορισμός κλάσης και τρεις δημιουργίες με new. Η δήλωση spare δεν δημιουργεί τέταρτο αντικείμενο.':'Μέτρησε χωριστά τον ορισμό class και τις εμφανίσεις new. Η τελευταία γραμμή δηλώνει μόνο μεταβλητή.');render();}
  });
  q('#ou-next-example').addEventListener('click',()=>go(stepIndex,1-exampleIndex));
  q('#ou-prev').addEventListener('click',()=>{if(stepIndex>0)go(stepIndex-1);});
  q('#ou-next').addEventListener('click',()=>{if(stepIndex<9)go(stepIndex+1);});
  root.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el)return;state().active=el.dataset.drag;if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.drag);}});
  root.addEventListener('dragover',e=>{const zone=e.target.closest('[data-zone]');if(zone){e.preventDefault();zone.classList.add('ou-drop-active');}});
  root.addEventListener('dragleave',e=>{const zone=e.target.closest('[data-zone]');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('ou-drop-active');});
  root.addEventListener('drop',e=>{const zone=e.target.closest('[data-zone]');if(!zone)return;e.preventDefault();const id=e.dataTransfer?.getData('text/plain')||state().active;if(!['template','first','second'].includes(id))return;state().assignments[id]=zone.dataset.zone;state().active=null;state().feedback=null;render();});
  render();
})();
</script>
<script>
(()=>{let pending=false;const report=()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;window.parent.postMessage({type:'java-lab-height',height:Math.ceil(document.getElementById('oop-unit-sample').getBoundingClientRect().height)},location.origin)})};new ResizeObserver(report).observe(document.getElementById('oop-unit-sample'));document.addEventListener('click',e=>{if(e.target.closest('[data-step],#ou-next,#ou-prev'))window.parent.postMessage({type:'java-lab-step'},location.origin)});report()})();
</script></body></html>
